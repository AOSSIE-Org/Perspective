# Builds the Next.js frontend as a static export and deploys it to GitHub Pages.
# Requires: Settings → Pages → Source = "GitHub Actions", and the custom domain (planned: perspective.aossie.org).
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: ["main"]
    paths: ["frontend/**", ".github/workflows/deploy-frontend-pages.yml"]
  workflow_dispatch:

# Least privilege: each job requests only what it needs below
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site settings
    env:
      # Override in the repository's Actions variables if the domain or backend changes
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://perspective.aossie.org' }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://thunder1245-perspective-backend.hf.space' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # No static_site_generator: it would overwrite next.config.mjs
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: frontend/out

  deploy:
    permissions:
      pages: write # publish the Pages deployment
      id-token: write # verify the deployment origin (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
