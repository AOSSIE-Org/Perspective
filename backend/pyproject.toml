[project]
name = "backend"
version = "0.1.0"
description = "Perspective backend: FastAPI + LangGraph pipeline that scrapes an article, detects bias and generates fact-checked counter-perspectives."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "dotenv>=0.9.9",
    "duckduckgo-search>=8.0.4",
    "fastapi>=0.115.12",
    "google-search-results>=2.4.2",
    "groq>=0.28.0",
    "langchain>=0.3.25",
    "langchain-community>=0.3.25",
    "langchain-groq>=0.3.2",
    "langgraph>=0.4.8",
    "logging>=0.4.9.6",
    "newspaper3k>=0.2.8",
    "nltk>=3.9.1",
    "pinecone>=7.3.0",
    "rake-nltk>=1.0.6",
    "readability-lxml>=0.8.4.1",
    "requests>=2.32.3",
    "sentence-transformers>=5.0.0",
    "trafilatura>=2.0.0",
    "uvicorn>=0.34.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
# "app" is the package directory; "main" is the main.py module. Listing them as
# sources also reports app/ files that no test imports (at 0%).
source = ["app", "main"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    # Script entry point (`uv run main.py`); starts a real uvicorn server.
    'if __name__ == "__main__":',
]
